:root{--paper:#F3F0E8;--ink:#343C38;--red:#A05C4A;--sage:#A4B1A0;--line:#b6bcb1;--scale:1}*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}body{background:#252c28;color:var(--ink);font-family:'Preview Sans SC','Noto Sans CJK SC',sans-serif}button,input,a{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}.viewer{height:calc(100dvh - 104px);display:flex;align-items:center;justify-content:center;overflow:hidden}.stage{position:relative;width:1920px;height:1080px;flex-shrink:0;transform:scale(var(--scale));transform-origin:center}.slide{display:none;width:1920px;height:1080px;position:absolute;inset:0;background:var(--paper);overflow:hidden;font-size:48px;line-height:1.38}.slide.active{display:block}.slide p,.slide h1,.slide h2,.slide figure,.slide blockquote{margin:0}.slide h1,.slide h2{font-family:'Preview Serif SC','Noto Serif CJK SC',serif;font-weight:600}.slide h1{font-size:64px;line-height:1.22;letter-spacing:.015em}.slide h2{font-size:56px;line-height:1.3}.slide p,.slide li,.slide figcaption,.slide cite,.slide b,.slide strong,.slide span{font-size:inherit}em{font-style:normal;color:var(--red)}header{position:absolute;left:104px;right:104px;top:40px;padding-bottom:22px;border-bottom:2px solid var(--line)}.eyebrow{display:flex;align-items:center;gap:18px;font-size:48px!important;line-height:1.3;margin-bottom:12px!important}.eyebrow i{width:12px;height:36px;background:var(--red);display:inline-block}.content{position:absolute;left:104px;right:104px;top:242px;bottom:204px}.takeaway{position:absolute;left:104px;right:104px;bottom:105px;min-height:68px;border-top:3px solid var(--red);padding-top:9px;font-size:48px;white-space:nowrap;line-height:1.2}footer{position:absolute;left:104px;right:104px;bottom:24px;display:flex;justify-content:space-between;font-size:48px;line-height:1.3;border-top:1px solid var(--line);padding-top:10px}.slide img{display:block;width:100%;height:100%;object-fit:cover}.slide svg{display:block;width:100%;height:au /* P01 restores the original full-height right-hand painting, rules and thesis. */
.cover-copy{position:absolute;left:104px;top:76px;width:1110px;z-index:2}.cover-copy h1{font-size:92px;line-height:1.38;letter-spacing:.015em;margin-top:64px;margin-bottom:32px}.subtitle{font-size:48px!important;white-space:nowrap}.cover-line{width:180px;height:2px;background:var(--red);margin:36px 0}.cover-position{font-size:52px!important;margin-bottom:22px!important}.cover-position em{font-weight:600}.cover-statement{font-size:48px!important;line-height:1.55}.cover-art{position:absolute;right:0;top:0;width:700px;height:1080px;overflow:hidden}.cover-art img{object-fit:cover;object-position:50% 18%;transform:scale(1.23);transform-origin:50% 0}.cover-art figcaption{position:absolute;bottom:117px;right:32px;padding:18px 24px;background:rgba(243,240,232,.94);font-size:48px;line-height:1.3}.cover footer{z-index:3;background:var(--paper);padding-bottom:0}.cover footer span:first-child{max-width:950px}
/* P02 and P06: one mountain / three bodily relations, not a text template. */
.three-scenes{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;align-content:start}.mountain-scene{padding:12px 10px 0;border-left:2px solid var(--line)}.mountain-scene h2{font-size:52px;margin-left:12px;white-space:nowrap}.mountain-scene svg{margin-top:22px}.mountain-scene p{padding-left:12px;margin-top:20px;font-size:48px;white-space:nowrap}.three-distances .scope{grid-column:1/-1;margin-top:3px}.three-distances .mountain-scene svg{height:358px}.three-distances .mountain-scene p{text-align:center;padding:0}
/* P03: contrast a stationary axis with multiple positions and a continuous path. */
.concept-pair{display:grid;grid-template-columns:1fr 1fr;gap:64px}.compare-concept h2{padding-bottom:18px;border-bottom:2px solid var(--line);display:flex;justify-content:space-between}.compare-concept h2 span{font-family:'Preview Sans SC','Noto Sans CJK SC',sans-serif;font-size:48px;color:var(--red)}.compare-concept svg{margin:18px 0;height:382px}.compare-concept p{text-align:center}.concept-pair>.scope{grid-column:1/-1;position:absolute;bottom:-4px;width:100%;font-size:48px}
/* P04: the three claims lead into a visibly central criterion. */
.thesis{font-size:52px!important;line-height:1.4}.argument-steps{display:flex;align-items:center;justify-content:space-between;margin-top:54px;gap:20px}.argument-steps>div{width:485px;padding:20px 20px 20px 0;border-top:3px solid var(--sage)}.argument-steps b{font-size:48px;color:var(--red);font-weight:500}.argument-steps h2{font-size:60px;margin:13px 0}.argument-steps p{font-size:48px;line-height:1.4}.argument-steps>span{font-size:64px;color:var(--red)}.complete-bar{margin-top:36px;border-top:2px solid var(--line);padding-top:22px;text-align:center;font-size:48px}.complete-bar strong{font-family:'Preview Serif SC','Noto Serif CJK SC',serif;font-size:64px;color:var(--red);margin-left:36px}
/* P05: both originals maintain their native aspect ratios; overlays register exactly. */
.works-pair{display:grid;grid-template-columns:1fr 1fr;gap:64px;top:222px;bottom:194px}.work-compare h2{font-size:52px;position:absolute;top:0;z-index:2;background:var(--paper);padding-right:12px}.work-compare{position:relative;display:flex;flex-direction:column;align-items:center}.painting-window{height:526px;width:100%;display:flex;align-items:center;justify-content:center;margin-top:65px}.registered{position:relative;flex-shrink:0;height:100%}.registered img{object-fit:contain}.registered.athens{width:678px;height:526px}.registered.early{width:362px;height:526px}.registered svg.art-overlay{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 1px 1px #fff)}.registered .arrow{stroke-width:6}.work-compare p{font-size:48px;margin-top:6px;align-self:flex-start}

.spring-analysis{display:flex;gap:140px;align-items:flex-start}.spring-full{position:relative;width:426px;height:620px;margin-left:20px}.spring-full img{object-fit:contain}.spot{position:absolute;border:4px solid var(--red);width:74px;height:74px}.spot-a{left:180px;top:515px}.spot-b{left:185px;top:300px}.spot-c{left:190px;top:65px}.spring-crops{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;width:1126px;margin-top:78px}.spring-crops figure{width:355px}.spring-crops img{height:390px}.spring-crops figcaption{font-size:48px;line-height:1.35;margin-top:18px}.crop-connectors{position:absolute!important;inset:0;width:100%;height:620px!important;pointer-events:none;z-index:0}.spring-crops,.spring-full{z-index:1}.spring-crops figure:nth-child(2){margin-top:0}.image-credit{position:absolute;left:564px;right:0;bottom:0;font-size:48px}

<div class="p02-note p02-foot"><h2>山脚 · 仰望</h2><p>身体处于山下，向上观看，感受到山体的高大。</p></div>
<div class="p02-note p02-valley"><h2>山中 · 行走</h2><p>进入山谷与山体之间，随着行走感受到空间的幽深与层次。</p></div>
<div class="p02-note p02-summit"><h2>山顶 · 远眺</h2><p>视野向远处展开，感受到空间的开阔与延伸。</p></div>
<p class="p02-core">身体位置改变了观看方向，也改变了空间被感知的方式。<br>固定视点下的视觉真实，并不能穷尽人的空间体验。</p>

f(document.fullscreenElement)await document.exitFullscreen();else await viewer.requestFullscreen();resize()}catch(e){alert('此浏览器不支持全屏，可打开“单页”横屏查看。')}};$('#overview').onclick=()=>$('#thumbs').showModal();$('#close-thumbs').onclick=()=>$('#thumbs').close();const grid=$('.thumb-grid');slides.forEach((s,i)=>{const b=document.createElement('button');const img=document.createElement('img');img.src=(single?'../screenshots/':'screenshots/')+s.id+'.png';img.alt=s.getAttribute('aria-label');img.loading='lazy';b.append(img);const t=document.createElement('span');t.textContent=s.id+(s.id==='P01'?' · 已确认':' · 待审核');b.append(t);b.onclick=()=>{$('#thumbs').close();show(i)};grid.append(b)});window.addEventListener('resize',resize);document.addEventListener('fullscreenchange',resize);window.visualViewport?.addEventListener('resize',resize);const initial=slides.findIndex(s=>'#'+s.id===location.hash);show(initial<0?0:initial);document.fonts.ready.then(resize);window.preview={show,resize};})();
