back" d="M10 310L100 120L150 200L240 30L320 165L370 110L485 310Z"/><path class="m-front" d="M0 320L90 235L145 268L210 150L285 270L350 223L500 320Z"/><path class="contour" d="M240 30L221 130L255 177M210 150L196 237M100 120L132 231"/></g><g transform="translate(28 320)" class="person"><circle cy="-31" r="12"/><path d="M0 -14V27M-24 8L0 -9L23 8M0 27L-18 53M0 27L20 53"/></g><path d="M72 290C130 300 260 245 290 150" class="arrow" marker-end="url(#arrow5)" stroke-dasharray="15 10"/></svg><figcaption><b>深远</b>｜自山前而窥山后</figcaption></figure><figure><svg class="" viewBox="0 0 520 380" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="arrow5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A05C4A"/></marker></defs><g transform="translate(280 125) scale(0.4)"><path class="m-back" d="M10 310L100 120L150 200L240 30L320 165L370 110L485 310Z"/><path class="m-front" d="M0 320L90 235L145 268L210 150L285 270L350 223L500 320Z"/><path class="contour" d="M240 30L221 130L255 177M210 150L196 237M100 120L132 231"/></g><g transform="translate(5 130) scale(0.65)"><path class="m-back" d="M10 310L100 120L150 200L240 30L320 165L370 110L485 310Z"/><path class="m-front" d="M0 320L90 235L145 268L210 150L285 270L350 223L500 320Z"/><path class="contour" d="M240 30L221 130L255 177M210 150L196 237M100 120L132 231"/></g><g transform="translate(95 225)" class="person"><circle cy="-31" r="12"/><path d="M0 -14V27M-24 8L0 -9L23 8M0 27L-18 53M0 27L20 53"/></g><path d="M130 200L460 145" class="arrow" marker-end="url(#arrow5)" /></svg><figcaption><b>平远</b>｜自近山而望远山</figcaption></figure></div><div class="argument-copy"><p>郭熙在《林泉高致》中以仰望、探察与远眺解释三远。它们不仅是构图方式，也说明身体位置和观看方向如何参与空间组织。</p><p>单点线性透视统一某一位置上的视觉关系；三远则把不同位置的经验综合起来，因此更能解释空间感知的多维性。</p></div></div><div class="takeaway">三远综合不同位置的观看经验，不是三个消失点。</div><footer><span>二辩 · 空间认知 · 理论阐释</span><span>P06 / 22</span></footer></section></div></main><nav class="controls" aria-
