<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>从观看山水到栖居山水｜22页待审核初稿</title><link rel="stylesheet" href="../styles.css"></head><body data-single="true"><main class="viewer"><div class="stage"><section class="slide page-09 " id="P09" aria-label="P09 观看为何能够转化为主动参与？"><header><p class="eyebrow"><i></i>空间体验 · 分论点二 / 二辩</p><h1>观看为何能够转化为主动参与？</h1></header><div class="content deep participation-essay"><div class="argument-copy"><p>山路、桥梁与小舟之所以重要，不只因为它们是画中景物；它们还可能引导观者想象自己进入画面。</p><p>当目光沿路径探索、把自身经验带入山水时，观者就不只是接受既成空间，也参与空间经验的形成。</p><p>因此，我方所说的“参与”包含游观与想象，不等同于实际走进画中，也不只是一种逼真的视觉幻觉。</p></div><div class="participation-aside"><h2>从接受到参与</h2><div>观看画面</div><span>↓</span><div>沿路径想象进入</div><span>↓</span><div>带入自身经验</div><p>据讲稿的教学归纳</p></div></div><div class="takeaway">身即更能激发观者对空间的主动参与。</div><footer><span>二辩 · 空间体验 · 分论点二</span><span>P09 / 22</span></footer></section></div></main><nav class="controls" aria-label="演示控制"><button id="prev">← 上一页</button><label>跳转 <input id="jump" type="number" min="1" max="22" value="1" aria-label="跳转页码"></label><span id="counter">01 / 22</span><button id="next">下一页 →</button><button id="overview">总览</button><a id="single" href="pages/P01.html" target="_blank">单页</a><button id="fullscreen">全屏</button><a href="../README.md">说明 / 来源</a></nav><dialog id="thumbs"><button id="close-thumbs">关闭总览</button><div class="thumb-grid"></div></dialog><script src="../app.js"></script></body></html>
