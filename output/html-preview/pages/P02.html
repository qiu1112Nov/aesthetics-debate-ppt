<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>从观看山水到栖居山水｜22页待审核初稿</title><link rel="stylesheet" href="../styles.css"></head><body data-single="true"><main class="viewer"><div class="stage"><section class="slide page-02 " id="P02" aria-label="P02 同一座山，体验为何随身体位置改变？"><header><p class="eyebrow"><i></i>问题提出 / 一辩</p><h1>同一座山，体验为何随身体位置改变？</h1></header><div class="content deep position-layout"><div class="position-study"><svg class="" viewBox="0 0 650 480" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A05C4A"/></marker></defs><g transform="translate(30 40) scale(1.08)"><path class="m-back" d="M10 310L100 120L150 200L240 30L320 165L370 110L485 310Z"/><path class="m-front" d="M0 320L90 235L145 268L210 150L285 270L350 223L500 320Z"/><path class="contour" d="M240 30L221 130L255 177M210 150L196 237M100 120L132 231"/></g><g transform="translate(53 365)" class="person"><circle cy="-31" r="12"/><path d="M0 -14V27M-24 8L0 -9L23 8M0 27L-18 53M0 27L20 53"/></g><g transform="translate(280 290)" class="person"><circle cy="-31" r="12"/><path d="M0 -14V27M-24 8L0 -9L23 8M0 27L-18 53M0 27L20 53"/></g><g transform="translate(303 90)" class="person"><circle cy="-31" r="12"/><path d="M0 -14V27M-24 8L0 -9L23 8M0 27L-18 53M0 27L20 53"/></g><path d="M83 330L280 90" class="arrow" marker-end="url(#arrow1)" /><path d="M315 260Q360 215 430 205" class="arrow" marker-end="url(#arrow1)" /><path d="M343 55L590 55" class="arrow" marker-end="url(#arrow1)" /></svg><p>仰望 · 入谷 · 远眺</p></div><div class="argument-copy"><p>站在山脚，我们感到山峰高大；进入山谷，感到幽深；登高远眺，又感到天地辽阔。</p><p>同一座山带来不同体验，说明空间的审美意义不只由景物的形状和位置决定，也取决于我们如何观看与行动。</p><p>身体位置改变了观看方向，也改变了空间的意义。固定视点下的视觉真实，不能穷尽这一感知过程。</p></div></div><div class="takeaway">空间审美还须解释身体如何参与感知。</div><footer><span>一辩 · 问题提出</span><span>P02 / 22</span></footer></section></div></main><nav class="controls" aria-label="演示控制"><button id="prev">← 上一页</button><label>跳转 <input id="jump" type="number" min="1" max="22" value="1" aria-label="跳转页码"></label><span id="counter">01 / 22</span><button id="next">下一页 →</button><button id="overview">总览</button><a id="single" href="pages/P01.html" target="_blank">单页</a><button id="fullscreen">全屏</button><a href="../README.md">说明 / 来源</a></nav><dialog id="thumbs"><button id="close-thumbs">关闭总览</button><div class="thumb-grid"></div></dialog><script src="../app.js"></script></body></html>
