<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>从观看山水到栖居山水｜22页待审核初稿</title><link rel="stylesheet" href="../styles.css"></head><body data-single="true"><main class="viewer"><div class="stage"><section class="slide page-08 " id="P08" aria-label="P08 《溪山行旅图》：尺度为何具有身体分量？"><header><p class="eyebrow"><i></i>空间认知 · 尺度分析 / 二辩</p><h1>《溪山行旅图》：尺度为何具有身体分量？</h1></header><div class="content deep work-essay fan-evidence-layout"><div class="fan-evidence"><figure><img class="" src="../assets/fan-kuan.jpg" style="" alt="真实馆藏山水作品"><figcaption>范宽 · [图3]</figcaption></figure><figure><img class="" src="../assets/fan-travelers.jpg" style="" alt="真实馆藏山水作品"><figcaption>山脚行旅局部<br>台北故宫藏</figcaption></figure></div><div class="argument-copy"><p><b>画面证据：</b>巍峨主峰占据主要空间，山脚行旅者极其微小，形成强烈的尺度对比。</p><p><b>经验如何生成：</b>微小人物使观者想象人在巨大山川中行走的身体经验，而非只辨认山体的比例。</p><p>山体的雄伟因此具有身体感知上的分量：空间审美超出视觉高度的再现。</p></div></div><div class="takeaway">人物尺度把山川的雄伟，转为可想象的身体经验。</div><footer><span>二辩 · 空间认知 · 尺度分析</span><span>P08 / 22</span></footer></section></div></main><nav class="controls" aria-label="演示控制"><button id="prev">← 上一页</button><label>跳转 <input id="jump" type="number" min="1" max="22" value="1" aria-label="跳转页码"></label><span id="counter">01 / 22</span><button id="next">下一页 →</button><button id="overview">总览</button><a id="single" href="pages/P01.html" target="_blank">单页</a><button id="fullscreen">全屏</button><a href="../README.md">说明 / 来源</a></nav><dialog id="thumbs"><button id="close-thumbs">关闭总览</button><div class="thumb-grid"></div></dialog><script src="../app.js"></script></body></html>
