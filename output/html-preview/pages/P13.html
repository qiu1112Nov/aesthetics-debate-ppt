<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>从观看山水到栖居山水｜22页待审核初稿</title><link rel="stylesheet" href="../styles.css"></head><body data-single="true"><main class="viewer"><div class="stage"><section class="slide page-13 " id="P13" aria-label="P13 郭熙：从值得观看，到愿意游居"><header><p class="eyebrow"><i></i>空间意境 · 画论解释 / 三辩</p><h1>郭熙：从值得观看，到愿意游居</h1></header><div class="content deep guoxi-layout"><div class="guoxi-essay"><blockquote>“但可行可望不如可居可游之为得。”<cite>郭熙《林泉高致集·山水训》</cite></blockquote><div class="argument-copy"><p>这段论述把山水的价值从值得观看，进一步指向进入其中、游历其中的愿望。</p><p>当山水成为可想象的游历与栖居世界，观看便连接了人的精神向往。这正支持我方对审美完整性的扩展。</p></div></div><div class="guoxi-aside"><div class="small-four-can"><span>可行</span><span>可望</span><b>可游</b><b>可居</b></div><figure><img class="" src="../assets/early-spring.jpg" style="object-position:45% 90%" alt="真实馆藏山水作品"><figcaption>《早春图》局部 · [图1]</figcaption></figure></div></div><div class="takeaway">可游可居的愿望，使山水成为精神参与的场所。</div><footer><span>三辩 · 空间意境 · 画论解释</span><span>P13 / 22</span></footer></section></div></main><nav class="controls" aria-label="演示控制"><button id="prev">← 上一页</button><label>跳转 <input id="jump" type="number" min="1" max="22" value="1" aria-label="跳转页码"></label><span id="counter">01 / 22</span><button id="next">下一页 →</button><button id="overview">总览</button><a id="single" href="pages/P01.html" target="_blank">单页</a><button id="fullscreen">全屏</button><a href="../README.md">说明 / 来源</a></nav><dialog id="thumbs"><button id="close-thumbs">关闭总览</button><div class="thumb-grid"></div></dialog><script src="../app.js"></script></body></html>
