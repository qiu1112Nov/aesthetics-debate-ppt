<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>从观看山水到栖居山水｜22页待审核初稿</title><link rel="stylesheet" href="../styles.css"></head><body data-single="true"><main class="viewer"><div class="stage"><section class="slide page-04 " id="P04" aria-label="P04 为什么以“空间审美的完整性”为标准？"><header><p class="eyebrow"><i></i>论证导航 / 一辩</p><h1>为什么以“空间审美的完整性”为标准？</h1></header><div class="content deep criterion-essay"><p class="deep-thesis">相较于透视，身即更能实现空间审美的完整性。</p><div class="argument-copy"><p>视觉再现是否准确，只回答空间“被看见”的一个维度。衡量审美是否完整，还要看它能否调动人的感知、参与和精神体验。</p></div><div class="claim-list"><p><b>01</b><span>相较于透视，身即更能呈现空间感知的多维性。</span></p><p><b>02</b><span>相较于透视，身即更能激发观者对空间的主动参与。</span></p><p><b>03</b><span>相较于透视，身即更能深化人与空间的精神联系。</span></p></div></div><div class="takeaway">以人的完整经验衡量空间审美，而非只比较视觉准确。</div><footer><span>一辩 · 论证导航</span><span>P04 / 22</span></footer></section></div></main><nav class="controls" aria-label="演示控制"><button id="prev">← 上一页</button><label>跳转 <input id="jump" type="number" min="1" max="22" value="1" aria-label="跳转页码"></label><span id="counter">01 / 22</span><button id="next">下一页 →</button><button id="overview">总览</button><a id="single" href="pages/P01.html" target="_blank">单页</a><button id="fullscreen">全屏</button><a href="../README.md">说明 / 来源</a></nav><dialog id="thumbs"><button id="close-thumbs">关闭总览</button><div class="thumb-grid"></div></dialog><script src="../app.js"></script></body></html>
