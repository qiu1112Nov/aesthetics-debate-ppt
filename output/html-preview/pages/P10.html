<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>从观看山水到栖居山水｜22页待审核初稿</title><link rel="stylesheet" href="../styles.css"></head><body data-single="true"><main class="viewer"><div class="stage"><section class="slide page-10 " id="P10" aria-label="P10 《千里江山图》：展开长卷，也在形成经验"><header><p class="eyebrow"><i></i>空间体验 · 长卷游观 / 二辩</p><h1>《千里江山图》：展开长卷，也在形成经验</h1></header><div class="content deep roll-essay"><div class="long-roll-windows"><figure><img class="" src="../assets/qianli-section.jpg" style="object-position:100% 50%" alt="真实馆藏山水作品"><figcaption>01 / 连续观看</figcaption></figure><figure><img class="" src="../assets/qianli-section.jpg" style="object-position:50% 50%" alt="真实馆藏山水作品"><figcaption>02 / 连续观看</figcaption></figure><figure><img class="" src="../assets/qianli-section.jpg" style="object-position:0% 50%" alt="真实馆藏山水作品"><figcaption>03 / 连续观看</figcaption></figure></div><div class="roll-arguments"><div class="argument-copy"><p>画卷逐段展开：前一段离开视野，后一段山水不断出现。空间不是同一瞬间的全景，而与观看的时间过程相连。</p></div><div class="argument-copy"><p>观者依次观看山峦、江河与桥梁，通过自身的观看活动形成经验。这种连续游观，使视觉接受进一步成为主动参与。</p></div></div><p class="roll-credit">王希孟 · 北宋 · 北京故宫 · [图4]　同一画段从右向左连续取景</p></div><div class="takeaway">空间也在观看过程中逐渐展开。</div><footer><span>二辩 · 空间体验 · 长卷游观</span><span>P10 / 22</span></footer></section></div></main><nav class="controls" aria-label="演示控制"><button id="prev">← 上一页</button><label>跳转 <input id="jump" type="number" min="1" max="22" value="1" aria-label="跳转页码"></label><span id="counter">01 / 22</span><button id="next">下一页 →</button><button id="overview">总览</button><a id="single" href="pages/P01.html" target="_blank">单页</a><button id="fullscreen">全屏</button><a href="../README.md">说明 / 来源</a></nav><dialog id="thumbs"><button id="close-thumbs">关闭总览</button><div class="thumb-grid"></div></dialog><script src="../app.js"></script></body></html>
