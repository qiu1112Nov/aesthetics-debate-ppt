<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>从观看山水到栖居山水｜22页待审核初稿</title><link rel="stylesheet" href="../styles.css"></head><body data-single="true"><main class="viewer"><div class="stage"><section class="slide page-12 " id="P12" aria-label="P12 空间意境：为何不能止于视觉真实？"><header><p class="eyebrow"><i></i>空间意境 · 分论点三 / 三辩</p><h1>空间意境：为何不能止于视觉真实？</h1></header><div class="content deep spirit-essay"><div class="argument-copy"><p><b>第三分论点：</b>相较于透视，身即更能深化人与空间的精神联系。</p><p>看见通向山林的小径、隐于树木的亭台，观者会想象沿路进入、在亭中感受山风与流水。</p><p>这类经验不依赖精确计算景物距离，却包含情感与精神意义。身即把这种精神参与纳入审美，因而不止于视觉真实。</p></div><figure class="spirit-evidence"><img class="" src="../assets/early-spring.jpg" style="object-position:32% 55%" alt="真实馆藏山水作品"><figcaption>《早春图》局部 · [图1]<br>用于呼应山水情境</figcaption></figure></div><div class="takeaway">身即将情感与精神参与，纳入空间审美的理解。</div><footer><span>三辩 · 空间意境 · 分论点三</span><span>P12 / 22</span></footer></section></div></main><nav class="controls" aria-label="演示控制"><button id="prev">← 上一页</button><label>跳转 <input id="jump" type="number" min="1" max="22" value="1" aria-label="跳转页码"></label><span id="counter">01 / 22</span><button id="next">下一页 →</button><button id="overview">总览</button><a id="single" href="pages/P01.html" target="_blank">单页</a><button id="fullscreen">全屏</button><a href="../README.md">说明 / 来源</a></nav><dialog id="thumbs"><button id="close-thumbs">关闭总览</button><div class="thumb-grid"></div></dialog><script src="../app.js"></script></body></html>
