<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>从观看山水到栖居山水｜22页待审核初稿</title><link rel="stylesheet" href="../styles.css"></head><body data-single="true"><main class="viewer"><div class="stage"><section class="slide page-21 " id="P21" aria-label="P21 当代启发：从人的行动与感知出发设计空间"><header><p class="eyebrow"><i></i>全场总结 · 当代延伸 / 四辩</p><h1>当代启发：从人的行动与感知出发设计空间</h1></header><div class="content deep implications-essay"><div class="design-implications"><div><b>园林游览</b><p>关注人在路径中怎样前行、仰望与回望；游览体验应从身体行动来理解，而不只从一处静止视点判断。</p></div><div><b>空间设计</b><p>除图纸准确与视觉美观，还要追问人在其中如何感知环境，使人的行动与感受成为设计考量。</p></div><div><b>交互体验</b><p>关注人在数字环境中怎样参与、获得情感与体验，将使用者的活动纳入对空间意义的理解。</p></div></div><p class="implication-note">据讲稿提出的行动、感知、情感三问展开；不指认具体建成案例。</p></div><div class="takeaway">空间不仅应被准确呈现，也应被充分体验。</div><footer><span>四辩 · 全场总结 · 当代延伸</span><span>P21 / 22</span></footer></section></div></main><nav class="controls" aria-label="演示控制"><button id="prev">← 上一页</button><label>跳转 <input id="jump" type="number" min="1" max="22" value="1" aria-label="跳转页码"></label><span id="counter">01 / 22</span><button id="next">下一页 →</button><button id="overview">总览</button><a id="single" href="pages/P01.html" target="_blank">单页</a><button id="fullscreen">全屏</button><a href="../README.md">说明 / 来源</a></nav><dialog id="thumbs"><button id="close-thumbs">关闭总览</button><div class="thumb-grid"></div></dialog><script src="../app.js"></script></body></html>
