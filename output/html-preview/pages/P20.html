<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>从观看山水到栖居山水｜22页待审核初稿</title><link rel="stylesheet" href="../styles.css"></head><body data-single="true"><main class="viewer"><div class="stage"><section class="slide page-20 " id="P20" aria-label="P20 为何三类经验共同支持空间审美的完整性？"><header><p class="eyebrow"><i></i>全场总结 · 核心论证 / 四辩</p><h1>为何三类经验共同支持空间审美的完整性？</h1></header><div class="content deep synthesis-essay"><p class="synthesis-premise"><b>判断前提：</b>视觉准确能组织可信空间，但审美完整性还取决于人的感知、参与与精神体验。</p><div class="synthesis-reasons"><div><h2>认知维度</h2><p>多维感知把身体位置与观看方向的变化纳入画面，使空间经验不止于一个固定视点。</p></div><div><h2>体验维度</h2><p>主动参与把观看过程纳入空间形成，观者不只接受画面，也以自身经验游历山水。</p></div><div><h2>意境维度</h2><p>精神联系使空间承载记忆、想象与情感，说明审美意义不能由几何准确单独概括。</p></div></div></div><div class="takeaway">依此完整性标准，身即更能将人的经验纳入空间审美。</div><footer><span>四辩 · 全场总结 · 核心论证</span><span>P20 / 22</span></footer></section></div></main><nav class="controls" aria-label="演示控制"><button id="prev">← 上一页</button><label>跳转 <input id="jump" type="number" min="1" max="22" value="1" aria-label="跳转页码"></label><span id="counter">01 / 22</span><button id="next">下一页 →</button><button id="overview">总览</button><a id="single" href="pages/P01.html" target="_blank">单页</a><button id="fullscreen">全屏</button><a href="../README.md">说明 / 来源</a></nav><dialog id="thumbs"><button id="close-thumbs">关闭总览</button><div class="thumb-grid"></div></dialog><script src="../app.js"></script></body></html>
