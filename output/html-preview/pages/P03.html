<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>从观看山水到栖居山水｜22页待审核初稿</title><link rel="stylesheet" href="../styles.css"></head><body data-single="true"><main class="viewer"><div class="stage"><section class="slide page-03 " id="P03" aria-label="P03 透视与身即：观看、组织与观者角色"><header><p class="eyebrow"><i></i>概念界定 / 一辩</p><h1>透视与身即：观看、组织与观者角色</h1></header><div class="content deep concept-essays"><div class="concept-essay"><h2>透视：固定视点</h2><svg class="" viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A05C4A"/></marker></defs><path class="grid" d="M80 10H720V155H80ZM80 10L400 60L720 10M80 155L400 60L720 155"/><circle class="red-dot" cx="400" cy="60" r="9"/><g transform="translate(400 120)" class="person"><circle cy="-31" r="12"/><path d="M0 -14V27M-24 8L0 -9L23 8M0 27L-18 53M0 27L20 53"/></g><path d="M400 83V69" class="arrow" marker-end="url(#arrow2)" /></svg><div class="argument-copy"><p><b>观看方式：</b>从确定位置出发，依几何投影建立远近关系。</p><p><b>空间组织：</b>消失点与比例缩减，使画面具有统一的视觉秩序。</p><p><b>观者角色：</b>面对已组织的空间，判断景物的位置与比例。</p></div></div><div class="concept-essay"><h2>身即：身体在场</h2><svg class="" viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#A05C4A"/></marker></defs><g transform="translate(250 10) scale(0.45)"><path class="m-back" d="M10 310L100 120L150 200L240 30L320 165L370 110L485 310Z"/><path class="m-front" d="M0 320L90 235L145 268L210 150L285 270L350 223L500 320Z"/><path class="contour" d="M240 30L221 130L255 177M210 150L196 237M100 120L132 231"/></g><g transform="translate(500 35) scale(0.34)"><path class="m-back" d="M10 310L100 120L150 200L240 30L320 165L370 110L485 310Z"/><path class="m-front" d="M0 320L90 235L145 268L210 150L285 270L350 223L500 320Z"/><path class="contour" d="M240 30L221 130L255 177M210 150L196 237M100 120L132 231"/></g><g transform="translate(70 95)" class="person"><circle cy="-31" r="12"/><path d="M0 -14V27M-24 8L0 -9L23 8M0 27L-18 53M0 27L20 53"/></g><g transform="translate(400 95)" class="person"><circle cy="-31" r="12"/><path d="M0 -14V27M-24 8L0 -9L23 8M0 27L-18 53M0 27L20 53"/></g><g transform="translate(700 95)" class="person"><circle cy="-31" r="12"/><path d="M0 -14V27M-24 8L0 -9L23 8M0 27L-18 53M0 27L20 53"/></g><path d="M100 120C200 180 290 150 340 80S480 105 550 70S640 108 675 112" class="arrow" marker-end="url(#arrow2)" stroke-dasharray="16 10"/></svg><div class="argument-copy"><p><b>观看方式：</b>抬头、前行与回望，使不同方向的经验相互联系。</p><p><b>空间组织：</b>把不同位置的观看经验综合于同一山水画面。</p><p><b>观者角色：</b>以观看、行动、记忆和想象，与空间建立联系。</p></div></div></div><div class="takeaway">比较典型单点线性透视；“身即”为本组分析概念。</div><footer><span>一辩 · 概念界定</span><span>P03 / 22</span></footer></section></div></main><nav class="controls" aria-label="演示控制"><button id="prev">← 上一页</button><label>跳转 <input id="jump" type="number" min="1" max="22" value="1" aria-label="跳转页码"></label><span id="counter">01 / 22</span><button id="next">下一页 →</button><button id="overview">总览</button><a id="single" href="pages/P01.html" target="_blank">单页</a><button id="fullscreen">全屏</button><a href="../README.md">说明 / 来源</a></nav><dialog id="thumbs"><button id="close-thumbs">关闭总览</button><div class="thumb-grid"></div></dialog><script src="../app.js"></script></body></html>
