<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>从观看山水到栖居山水｜22页待审核初稿</title><link rel="stylesheet" href="../styles.css"></head><body data-single="true"><main class="viewer"><div class="stage"><section class="slide page-17 " id="P17" aria-label="P17 梅洛-庞蒂：身体何以成为空间经验的条件？"><header><p class="eyebrow"><i></i>空间意境 · 现代对话 / 三辩</p><h1>梅洛-庞蒂：身体何以成为空间经验的条件？</h1></header><div class="content deep embodied-layout"><div class="argument-copy"><p><b>《知觉现象学》的现代视角：</b>身体不只是放在空间里的物体，而是我们感知和理解世界的基本条件。</p><p>我们通过位置、方向、行动能力以及与环境的关系认识空间。因此，空间还包含身体能够行动、感知和参与的世界。</p><p>这为身即提供解释视角：身体经验与精神参与应纳入审美。但这是一种现代对话，不是对古代山水画的历史影响。</p></div><aside class="embodied-aside"><div>身体的位置与行动</div><span>↓</span><div>对环境的感知</div><span>↓</span><div>经验中的空间</div><p>思想转述，非引文</p></aside></div><div class="takeaway">空间也是身体能够行动、感知和参与的世界。</div><footer><span>三辩 · 空间意境 · 现代对话</span><span>P17 / 22</span></footer></section></div></main><nav class="controls" aria-label="演示控制"><button id="prev">← 上一页</button><label>跳转 <input id="jump" type="number" min="1" max="22" value="1" aria-label="跳转页码"></label><span id="counter">01 / 22</span><button id="next">下一页 →</button><button id="overview">总览</button><a id="single" href="pages/P01.html" target="_blank">单页</a><button id="fullscreen">全屏</button><a href="../README.md">说明 / 来源</a></nav><dialog id="thumbs"><button id="close-thumbs">关闭总览</button><div class="thumb-grid"></div></dialog><script src="../app.js"></script></body></html>
